name: CI Test

on:
  push:
  # When requested manually
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, 'skip ci')"

    steps:
    - uses: actions/checkout@v2
    
    - name: Checkout submodules
      shell: bash
      run: |
        auth_header="$(git config --local --get http.https://github.com/.extraheader)"
        git submodule sync --recursive
        git -c "http.extraheader=$auth_header" -c protocol.version=2 submodule update --init --force --recursive --depth=1
    
    - name: Pull and run docker 🐋 
      shell: bash
      env:
        GITHUB_REF: ${{ github.ref }}
        GITHUB_SHA: ${{ github.sha }}
      run: |
        docker pull stanfordaha/garnet:latest
        docker run -d --name garnet_container --rm -it \
          -e GITHUB_REF="${GITHUB_REF}" \
          -e GITHUB_SHA="${GITHUB_SHA}" \
          stanfordaha/garnet:latest bash

    - name: Install deps 🛠️
      shell: bash
      run: |
        # Test this checkout: put it in place of the image's canal (fetching inside the
        # container failed: the image's canal remote asks for credentials)
        docker exec -i garnet_container bash -c "rm -rf /aha/canal"
        docker cp ../canal garnet_container:/aha/canal
        docker exec -i garnet_container bash -c "pip install -r /aha/canal/requirements.txt"
        docker exec -i garnet_container bash -c "pip install -e /aha/canal"

    - name: Check style (setup.cfg) 🔎
      shell: bash
      run: |
        docker exec -i garnet_container bash -c '
            set -e
            source /aha/bin/activate
            pip install pycodestyle
            cd /aha/canal
            python -m pycodestyle canal tests *.py
        '

    - name: Run pointwise test ⚙️
      shell: bash
      run: |
        docker exec -i garnet_container bash -c '
            set -e
            source /aha/bin/activate
            aha map apps/pointwise
            aha pnr apps/pointwise --width 4 --height 4
        '
